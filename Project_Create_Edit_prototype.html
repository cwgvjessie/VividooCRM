<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>專案編輯頁面 - 互動式原型匯出</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & Babel CDN -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- SheetJS CDN (用於匯出 Excel) -->
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect } = React;

        const Icon = ({ name, size = 18, className = "" }) => {
            return <i data-lucide={name} className={className} style={{ width: size, height: size }}></i>;
        };

        const App = () => {
            const [basicInfo, setBasicInfo] = useState({
                projectId: 'LA1120500',
                projectName: '典範課程第六期',
                regStartDate: '2026-02-01',
                regEndDate: '2026-03-01',
                courseDate: '2026-04-15',
                category: '典範大師',
                status: '草稿', 
                lastModifiedBy: 'Jason Chen (PM01)',
                lastModifiedAt: '2026-02-01 19:42:00'
            });

            const [costs, setCosts] = useState({
                "教學與師資": [{ name: '講師費', amount: 85000 }, { name: '授權費', amount: 15000 }],
                "場地與設備": [{ name: '遠企宴會廳租金', amount: 45000 }],
                "營運與行政": [{ name: '講義印刷', amount: 5000 }, { name: '保險費', amount: 3000 }],
                "行銷與推廣": [{ name: 'Line推廣耗材', amount: 12000 }, { name: 'KOL分潤', amount: 20000 }],
                "人力支援": [{ name: '主持人費', amount: 8000 }],
                "其他": [{ name: '印花稅', amount: 500 }]
            });

            const [errorMsg, setErrorMsg] = useState(null);

            useEffect(() => {
                lucide.createIcons();
            }, [costs, basicInfo, errorMsg]);

            const categorySubtotals = useMemo(() => {
                const subtotals = {};
                Object.keys(costs).forEach(cat => {
                    subtotals[cat] = costs[cat].reduce((sum, item) => sum + (Number(item.amount) || 0), 0);
                });
                return subtotals;
            }, [costs]);

            const totalCost = useMemo(() => {
                return Object.values(categorySubtotals).reduce((sum, val) => sum + val, 0);
            }, [categorySubtotals]);

            const updateBasicInfo = (field, value) => setBasicInfo(prev => ({ ...prev, [field]: value }));
            const updateCost = (category, index, field, value) => {
                const newList = [...costs[category]];
                newList[index][field] = value;
                setCosts({ ...costs, [category]: newList });
            };
            const addCostRow = (category) => setCosts({ ...costs, [category]: [...costs[category], { name: '', amount: 0 }] });
            const removeCostRow = (category, index) => {
                const newList = [...costs[category]];
                newList.splice(index, 1);
                setCosts({ ...costs, [category]: newList });
            };

            const validateData = () => {
                const { projectId, projectName, regStartDate, regEndDate, courseDate } = basicInfo;
                if (!projectId || !projectName || !regStartDate || !regEndDate || !courseDate) {
                    setErrorMsg("請填寫所有必填欄位 (標註 * 之項目)");
                    return false;
                }
                const start = new Date(regStartDate);
                const end = new Date(regEndDate);
                const course = new Date(courseDate);
                if (end < start) {
                    setErrorMsg("報名截止日期 不可早於 報名開始日期");
                    return false;
                }
                if (course < end) {
                    setErrorMsg("開課日期 不可早於 報名截止日期");
                    return false;
                }
                return true;
            };

            const handleSave = () => {
                if (!validateData()) return;
                setErrorMsg(null);
                showToast("專案已成功儲存！");
            };

            const handleExport = () => {
                if (!validateData()) return;

                const exportData = [];
                const mockStudents = [
                    { "姓名": "王小明", "聯絡電話": "0912-345-678", "Email": "ming@example.com", "報名狀態": "已繳費" },
                    { "姓名": "李曉華", "聯絡電話": "0922-111-222", "Email": "hua@example.com", "報名狀態": "待核帳" },
                    { "姓名": "張大維", "聯絡電話": "0933-444-555", "Email": "david@example.com", "報名狀態": "已繳費" }
                ];

                mockStudents.forEach(student => {
                    exportData.push({
                        "專案編號": basicInfo.projectId,
                        "專案名稱": basicInfo.projectName,
                        ...student,
                        "最後修改人": basicInfo.lastModifiedBy,
                        "最後修改日期": basicInfo.lastModifiedAt
                    });
                });

                const ws = XLSX.utils.json_to_sheet(exportData);
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, "學員名單");
                
                XLSX.writeFile(wb, `學員名單_${basicInfo.projectId}_${new Date().getTime()}.xlsx`);
                showToast("學員名單匯出成功！");
            };

            const showToast = (msg) => {
                const successDiv = document.createElement('div');
                successDiv.innerHTML = `<div style="position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#10b981;color:white;padding:16px 32px;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,0.15);z-index:9999;font-weight:bold;font-size:16px;">${msg}</div>`;
                document.body.appendChild(successDiv);
                setTimeout(() => successDiv.remove(), 3000);
            };

            const statusOptions = ["草稿", "進行中", "已結案", "已取消"];

            return (
                <div className="min-h-screen bg-slate-50 text-slate-900 pb-20 text-base flex flex-col overflow-x-hidden">
                    {/* 錯誤提示彈窗 */}
                    {errorMsg && (
                        <div className="fixed inset-0 bg-black/40 backdrop-blur-sm z-[9999] flex items-center justify-center p-4 text-center text-slate-900">
                            <div className="bg-white rounded-3xl p-8 max-w-md w-full shadow-2xl animate-in zoom-in-95 duration-200">
                                <div className="flex flex-col items-center gap-4 text-red-500 mb-6">
                                    <Icon name="alert-circle" size={48} />
                                    <h4 className="text-xl font-black tracking-tight">檢核未通過</h4>
                                </div>
                                <p className="text-slate-600 text-lg font-medium mb-8 leading-relaxed px-2">{errorMsg}</p>
                                <button onClick={() => setErrorMsg(null)} className="w-full py-4 bg-slate-900 text-white text-lg font-bold rounded-2xl hover:bg-slate-800 transition-all active:scale-95 shadow-xl shadow-slate-200">
                                    返回修改
                                </button>
                            </div>
                        </div>
                    )}

                    {/* 頁面頂部顯示標題與預算統計 */}
                    <div className="max-w-4xl mx-auto w-full px-6 pt-12 pb-6 flex justify-between items-end border-b-2 border-slate-200 mb-8">
                        <div className="flex items-center gap-5">
                            <div className="bg-slate-900 p-3 rounded-2xl text-white shadow-lg">
                                <Icon name="layout-grid" size={28} />
                            </div>
                            <div>
                                <h1 className="text-3xl font-black text-slate-800 leading-tight">專案編輯頁面 (2.4.2.4)</h1>
                                <p className="text-sm font-bold text-slate-400 mt-2 uppercase tracking-widest flex items-center gap-2">
                                    當前狀態：<span className="text-blue-600 font-black bg-blue-50 px-2 py-0.5 rounded">{basicInfo.status}</span>
                                </p>
                            </div>
                        </div>
                        <div className="text-right">
                            <p className="text-xs font-black text-slate-400 uppercase tracking-widest leading-none">預算總計 (TWD)</p>
                            <p className="text-3xl font-mono font-black text-blue-600 mt-2 tracking-tighter">${totalCost.toLocaleString()}</p>
                        </div>
                    </div>

                    <main className="max-w-4xl mx-auto space-y-10 px-6 flex-grow">
                        {/* A. 專案基本設定 */}
                        <section className="bg-white rounded-3xl shadow-sm border border-slate-200 p-10">
                            <div className="flex items-center gap-4 mb-10 border-b border-slate-50 pb-6">
                                <div className="p-2 bg-blue-50 rounded-xl text-blue-500">
                                    <Icon name="file-text" size={24} />
                                </div>
                                <h2 className="text-xl font-black uppercase tracking-widest text-slate-800 font-bold">A. 專案基本設定</h2>
                            </div>
                            
                            <div className="mb-12">
                                <h3 className="text-sm font-black text-blue-500 uppercase tracking-widest mb-6 flex items-center gap-3">
                                    <span className="w-1.5 h-4 bg-blue-500 rounded-full"></span>
                                    基本資訊
                                </h3>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-8 pl-4">
                                    <div className="space-y-2.5">
                                        <label className="text-sm font-black text-slate-400 uppercase tracking-wider block">專案編號 *</label>
                                        <input type="text" value={basicInfo.projectId} onChange={(e) => updateBasicInfo('projectId', e.target.value)} className="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl font-mono text-base font-bold focus:ring-4 focus:ring-blue-50 focus:bg-white outline-none transition-all" placeholder="輸入唯一識別碼" />
                                    </div>
                                    <div className="space-y-2.5">
                                        <label className="text-sm font-black text-slate-400 uppercase tracking-wider block">專案名稱 *</label>
                                        <input type="text" value={basicInfo.projectName} onChange={(e) => updateBasicInfo('projectName', e.target.value)} className="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-base font-black text-slate-800 focus:ring-4 focus:ring-blue-50 focus:bg-white outline-none transition-all" placeholder="顯示全名" />
                                    </div>
                                </div>
                            </div>

                            <div>
                                <h3 className="text-sm font-black text-indigo-500 uppercase tracking-widest mb-6 flex items-center gap-3">
                                    <span className="w-1.5 h-4 bg-indigo-500 rounded-full"></span>
                                    專案資訊
                                </h3>
                                <div className="grid grid-cols-1 md:grid-cols-3 gap-8 pl-4 mb-8">
                                    <div className="space-y-2.5">
                                        <label className="text-sm font-black text-slate-400 uppercase tracking-wider flex items-center gap-2">
                                            <Icon name="calendar" size={16} className="text-slate-300" />
                                            報名開始日期 *
                                        </label>
                                        <input type="date" value={basicInfo.regStartDate} onChange={(e) => updateBasicInfo('regStartDate', e.target.value)} className="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-base font-bold outline-none focus:ring-4 focus:ring-indigo-50 focus:bg-white transition-all" />
                                    </div>
                                    <div className="space-y-2.5">
                                        <label className="text-sm font-black text-slate-400 uppercase tracking-wider flex items-center gap-2">
                                            <Icon name="calendar" size={16} className="text-slate-300" />
                                            報名截止日期 *
                                        </label>
                                        <input type="date" value={basicInfo.regEndDate} onChange={(e) => updateBasicInfo('regEndDate', e.target.value)} className="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-base font-bold outline-none focus:ring-4 focus:ring-indigo-50 focus:bg-white transition-all" />
                                    </div>
                                    <div className="space-y-2.5">
                                        <label className="text-sm font-black text-slate-400 uppercase tracking-wider flex items-center gap-2">
                                            <Icon name="calendar" size={16} className="text-slate-300" />
                                            開課日期 *
                                        </label>
                                        <input type="date" value={basicInfo.courseDate} onChange={(e) => updateBasicInfo('courseDate', e.target.value)} className="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-base font-bold outline-none focus:ring-4 focus:ring-indigo-50 focus:bg-white transition-all" />
                                    </div>
                                </div>
                                <div className="pl-4">
                                    <div className="space-y-2.5 max-w-sm">
                                        <label className="text-sm font-black text-slate-400 uppercase tracking-wider block">專案分類</label>
                                        <select value={basicInfo.category} onChange={(e) => updateBasicInfo('category', e.target.value)} className="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-base font-bold bg-white outline-none focus:ring-4 focus:ring-indigo-50 cursor-pointer">
                                            <option>請選擇</option>
                                            <option>典範大師</option>
                                            <option>趨勢主題</option>
                                            <option>營運實戰</option>
                                            <option>其他</option>
                                        </select>
                                    </div>
                                </div>
                            </div>
                        </section>

                        {/* B. 成本結構 */}
                        <section className="bg-white rounded-3xl shadow-sm border border-slate-200 p-10">
                             <div className="flex items-center gap-4 mb-8 border-b border-slate-50 pb-6">
                                <div className="p-2 bg-emerald-50 rounded-xl text-emerald-500">
                                    <Icon name="wallet" size={24} />
                                </div>
                                <h2 className="text-xl font-black uppercase tracking-widest text-slate-800 font-bold">B. 成本結構與預算</h2>
                            </div>
                            <div className="space-y-12">
                                {Object.keys(costs).map((catName) => (
                                    <div key={catName} className="space-y-6">
                                        <div className="flex justify-between items-end border-b-2 border-slate-100 pb-2.5">
                                            <h3 className="text-base font-black uppercase tracking-widest text-slate-800">{catName}</h3>
                                            <div className="text-xs font-black text-slate-400 uppercase">
                                                小計: <span className="font-mono text-base text-slate-900 ml-2 tracking-tighter">${categorySubtotals[catName].toLocaleString()}</span>
                                            </div>
                                        </div>
                                        <div className="space-y-3">
                                            {costs[catName].map((item, idx) => (
                                                <div key={idx} className="flex gap-4 group items-center">
                                                    <input type="text" value={item.name} placeholder="項目名稱" onChange={(e) => updateCost(catName, idx, 'name', e.target.value)} className="flex-grow px-4 py-3 border border-slate-100 bg-slate-50/50 rounded-xl text-base font-bold focus:bg-white focus:border-slate-300 focus:ring-4 focus:ring-slate-50 outline-none transition-all" />
                                                    <div className="w-40 relative">
                                                        <span className="absolute left-4 top-3.5 text-xs text-slate-400 font-mono">$</span>
                                                        <input type="number" value={item.amount || ''} placeholder="0" onChange={(e) => updateCost(catName, idx, 'amount', e.target.value)} className="w-full pl-8 pr-4 py-3 border border-slate-100 bg-slate-50/50 rounded-xl font-mono font-black text-right text-base focus:bg-white focus:border-slate-300 focus:ring-4 focus:ring-slate-50 outline-none transition-all" />
                                                    </div>
                                                    <button onClick={() => removeCostRow(catName, idx)} className="p-3 text-slate-200 hover:text-red-500 hover:bg-red-50 rounded-xl opacity-0 group-hover:opacity-100 transition-all active:scale-90"><Icon name="trash-2" size={20} /></button>
                                                </div>
                                            ))}
                                            <button onClick={() => addCostRow(catName)} className="text-sm font-black text-blue-500 hover:text-blue-700 flex items-center gap-2 px-3 py-2 rounded-xl hover:bg-blue-50 transition-all uppercase tracking-widest">
                                                <Icon name="plus" size={16} /> 新增項目
                                            </button>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </section>
                    </main>

                    {/* Footer: 專案狀態 (RadioButton) + 按鈕 + 軌跡資訊 */}
                    <footer className="max-w-4xl mx-auto w-full px-6 py-16 mt-12 border-t-2 border-slate-200 flex flex-col items-center">
                        
                        {/* 專案狀態單選 */}
                        <div className="mb-14 w-full text-center">
                            <span className="text-sm font-black text-slate-400 uppercase tracking-[0.2em] mb-8 block font-bold">專案狀態設定</span>
                            <div className="flex flex-wrap justify-center gap-10">
                                {statusOptions.map(opt => (
                                    <label key={opt} className="flex items-center gap-4 cursor-pointer group">
                                        <div className="relative flex items-center justify-center">
                                            <input 
                                                type="radio" 
                                                name="projectStatus" 
                                                value={opt} 
                                                checked={basicInfo.status === opt}
                                                onChange={() => updateBasicInfo('status', opt)}
                                                className="peer appearance-none w-6 h-6 border-2 border-slate-300 rounded-full checked:border-blue-600 transition-all cursor-pointer"
                                            />
                                            <div className="absolute w-3 h-3 bg-blue-600 rounded-full opacity-0 peer-checked:opacity-100 transition-opacity pointer-events-none"></div>
                                        </div>
                                        <span className={`text-base font-black transition-colors ${basicInfo.status === opt ? "text-slate-900 scale-110" : "text-slate-400 group-hover:text-slate-600"}`}>
                                            {opt}
                                        </span>
                                    </label>
                                ))}
                            </div>
                        </div>

                        {/* 按鈕組：匯出學員名單 & 儲存變更 */}
                        <div className="flex flex-col sm:flex-row gap-6 mb-16 w-full justify-center border-b border-slate-100 pb-16">
                            <button onClick={handleExport} className="px-10 py-4 bg-white border-2 border-slate-200 text-slate-700 text-lg font-black rounded-2xl hover:bg-slate-50 transition-all flex items-center justify-center gap-3 shadow-sm active:scale-95">
                                <Icon name="users" size={22} className="text-slate-400" /> 匯出學員名單
                            </button>
                            <button onClick={handleSave} className="px-12 py-4 bg-blue-600 text-white text-lg font-black rounded-2xl hover:bg-blue-700 transition-all flex items-center justify-center gap-3 shadow-2xl shadow-blue-100 active:scale-95">
                                <Icon name="save" size={22} /> 儲存變更
                            </button>
                        </div>

                        {/* 修改軌跡資訊 (唯讀, 左右排佈) */}
                        <div className="flex flex-row justify-center items-center gap-10 text-slate-400 text-xs font-black tracking-[0.1em] uppercase text-center opacity-80">
                            <div className="flex items-center gap-2">
                                <Icon name="user-check" size={14} className="opacity-60" />
                                最後修改帳號：<span className="text-slate-500 font-bold">{basicInfo.lastModifiedBy}</span>
                            </div>
                            <div className="w-px h-4 bg-slate-200 hidden sm:block"></div>
                            <div className="flex items-center gap-2">
                                <Icon name="clock" size={14} className="opacity-60" />
                                最後修改日期：<span className="text-slate-500 font-mono font-bold">{basicInfo.lastModifiedAt}</span>
                            </div>
                        </div>
                        <div className="mt-8 opacity-40 text-[10px] italic font-bold tracking-[0.2em] uppercase">
                            CONFIDENTIAL • INTERNAL USE ONLY • SYSTEM LOGGED
                        </div>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
